name: Twin Layer CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install transport dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi mcp requests uvicorn

      - name: Syntax gate
        run: python -m compileall -q src mocks tools

      - name: Tests, coverage and leakage gate
        run: python tools/run_checks.py --evidence tmp/ci

      - name: Standalone Twin + partner mocks proof [R1]
        run: python tools/run_standalone.py --run-id ci-standalone

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-ci-evidence
          path: |
            tmp/ci
            logs/*.jsonl
          if-no-files-found: ignore
